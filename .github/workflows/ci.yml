name: CI

on:
  push:
    branches: [ main, 'phase-*' ]
  pull_request:

jobs:
  firmware:
    name: Firmware build (esp32-mqtt-simple)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: |
          set -o pipefail
          pio run -e esp32-mqtt-simple 2>&1 | tee build.log
      # The job log needs authentication to read; a check annotation is public.
      # This makes a red pipeline diagnosable from an API call.
      - name: Expose build failure
        if: failure()
        run: |
          python - <<'PY'
          data = open('build.log', encoding='utf-8', errors='replace').read()
          tail = data[-4000:]
          esc = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + esc)
          PY
      - name: Report flash usage
        run: |
          size "$(find .pio/build/esp32-mqtt-simple -name firmware.elf | head -1)" || true

  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for f in web/ui/*.js dev/*.mjs; do
            node --check "$f"
          done
      - name: Unit tests
        run: node --test test/gps.test.js test/guard.test.js test/info.test.js test/lap.test.js test/led.test.js test/ui.test.js

  worker:
    name: History API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check worker/src/index.js
          node --check "worker/pages/functions/[[path]].js"
      - name: Ingest and history rules
        run: node --test worker/test/ingest.test.mjs
