; PlatformIO Project Configuration File
; ESP32 Monitoring — Arduino Framework Migration
;
; Build environments:
;   pio run -e esp32-mqtt-simple   -> MQTT, single Wi-Fi network  (secret.txt)

[env:base]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
    https://github.com/knolleary/pubsubclient.git
    https://github.com/mikalhart/TinyGPSPlus.git
lib_ldf_mode = deep+

[env:esp32-mqtt-simple]
extends = env:base
build_flags = -DUSE_MQTT_SIMPLE
build_src_filter = +<main.cpp> +<mqtt_simple/*>
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
; log2file tees the console to logs/device-monitor-<timestamp>.log
monitor_filters = log2file
