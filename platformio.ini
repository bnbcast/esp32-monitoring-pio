; PlatformIO Project Configuration File
; ESP32 Monitoring — Arduino Framework Migration
;
; Build environments:
;   pio run -e esp32-mqtt-simple   -> MQTT, single Wi-Fi network  (secret.txt)

[env:base]
; Pinned on purpose. An unpinned platform or library means CI resolves a
; different toolchain than this machine, which is how a green local build turns
; into a red pipeline. 8.0.0 is the version this project is tested against.
platform = espressif32@8.0.0
board = esp32doit-devkit-v1
framework = arduino
; 3 MB app + 896 KB LittleFS, no OTA slot. Approved: USB flashing is the
; update path anyway, and W3 needs the room for the HTTPS batch buffer.
board_build.partitions = huge_app.csv
lib_deps =
    knolleary/PubSubClient@2.8
    mikalhart/TinyGPSPlus@1.1.0
lib_ldf_mode = deep+
; Arduino-ESP32 3.3.x keeps WiFi's Network.h in a separate bundled library
; (libraries/Network) that PlatformIO's finder does not select. The script adds
; it only when the clean layout is present, so older installs still work.
extra_scripts = pre:dev/pio_network_lib.py

[env:esp32-mqtt-simple]
extends = env:base
build_flags = -DUSE_MQTT_SIMPLE
build_src_filter = +<main.cpp> +<mqtt_simple/*>
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
; log2file tees the console to logs/device-monitor-<timestamp>.log
monitor_filters = log2file

; One-shot measurement build (TLS handshake heap + ECDSA timing). Not the
; tracker: pio run -e esp32-bench -t upload
[env:esp32-bench]
extends = env:base
build_src_filter = +<bench/*>
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200

; Same tracker plus the history self-test key ('t' on the console). The epoch
; is baked into src/history_secret.h by dev/gen-history-secret.mjs, so the
; frames pass the server's clock gate. Flash this only to prove the pipeline,
; then flash esp32-mqtt-simple again.
[env:esp32-history-test]
extends = env:esp32-mqtt-simple
build_flags = -DUSE_MQTT_SIMPLE -DHISTORY_SELFTEST=1
