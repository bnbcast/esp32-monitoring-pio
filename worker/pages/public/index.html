<h1>race-tracker-history</h1>
<p>JSON API for the ESP32 race tracker. No UI lives here; the dashboard is on GitHub Pages.</p>
<ul>
  <li><code>GET /health</code> — liveness</li>
  <li><code>GET /history?from=&amp;to=&amp;limit=</code> — stored fixes</li>
  <li><code>POST /ingest</code> — device batches, needs <code>X-Ingest-Key</code></li>
</ul>
